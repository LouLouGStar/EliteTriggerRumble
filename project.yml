name: EliteTriggerRumble
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
targets:
  EliteTriggerRumble:
    type: application
    platform: iOS
    sources:
      - EliteTriggerRumble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EliteTriggerRumble
        PRODUCT_NAME: EliteTriggerRumble
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Elite Trigger Rumble"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
